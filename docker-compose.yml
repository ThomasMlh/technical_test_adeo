name: product-catalog

services:
  postgres:
    # Pinned to an exact minor version: upgrades are explicit, reviewed changes
    # (see .github/dependabot.yml), never a silent `latest` pull.
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog -d catalog']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
